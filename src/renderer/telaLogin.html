<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="telaLogin.css">
</head>
<body>
    <div class="login-card">
        <h1 id="titulo">Acesse sua conta</h1>

        <form id="form-login">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Seu E-mail aqui" required>

            <label for="senha">Senha:</label>
            <div class="campo-senha">
                <input type="password" id="senha" name="senha" placeholder="Sua senha aqui" required>
                <button type="button" class="btn-olho" aria-label="Mostrar senha">
                    <svg class="icone-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icone-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <p id="erro-login" class="erro"></p>

            <button type="submit">Entrar</button>

            <p>Não tem conta? <a href="#" id="ir-cadastro">Cadastre-se</a></p>
        </form>

        <form id="form-cadastro" class="oculto">
            <label for="nome-cadastro">Nome:</label>
            <input type="text" id="nome-cadastro" name="nome" placeholder="Seu nome" required>

            <label for="email-cadastro">E-mail:</label>
            <input type="email" id="email-cadastro" name="email" placeholder="Seu E-mail aqui" required>

            <label for="senha-cadastro">Senha:</label>
            <div class="campo-senha">
                <input type="password" id="senha-cadastro" name="senha" placeholder="Crie uma senha" required>
                <button type="button" class="btn-olho" aria-label="Mostrar senha">
                    <svg class="icone-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icone-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <label for="confirmar-senha">Confirmar senha:</label>
            <div class="campo-senha">
                <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" required>
                <button type="button" class="btn-olho" aria-label="Mostrar senha">
                    <svg class="icone-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icone-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <p id="erro-cadastro" class="erro"></p>

            <button type="submit">Criar conta</button>

            <p>Já tem conta? <a href="#" id="ir-login">Entrar</a></p>
        </form>
    </div>

    <script src="telaLogin.js"></script>
</body>
</html>
